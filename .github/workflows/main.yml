name: Hidden America Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate USA Facts script and voiceover
        run: python script_generator.py

      - name: Generate video
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from video_generator import create_video

          output = Path("output")
          output.mkdir(exist_ok=True)

          audio = output / "voiceover.mp3"
          image = output / "background.png"
          video = output / "hidden_america.mp4"

          if not audio.exists():
              raise FileNotFoundError("Voiceover audio was not created")

          canvas = Image.new("RGB", (1080, 1920), "#10243a")
          draw = ImageDraw.Draw(canvas)
          draw.text((80, 700), "HIDDEN AMERICA 2030",
                    fill="white", stroke_width=1)
          draw.text((80, 800), "USA FACTS",
                    fill="white", stroke_width=1)
          canvas.save(image)

          create_video(image, audio, video)
          print(f"VIDEO CREATED: {video}")
          PY

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: hidden-america-video
          path: output/
          if-no-files-found: error
